name: Build OmniBizCRM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable

      - name: Flutter dependencies
        run: flutter pub get

      - name: Fix image_cropper Android compile SDK
        run: |
          PLUGIN_FILES="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/image_cropper-*/android/build.gradle*' -type f)"
          if [ -z "$PLUGIN_FILES" ]; then
            echo "ERROR: image_cropper Gradle file not found"
            exit 1
          fi
          while IFS= read -r file; do
            sed -i -E 's/(compileSdkVersion[[:space:]]+)33/\1 36/; s/(compileSdk[[:space:]]*=[[:space:]]*)33/\1 36/' "$file"
            echo "----- $file -----"
            grep -n 'compileSdk' "$file"
          done <<< "$PLUGIN_FILES"


      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBizCRM-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
